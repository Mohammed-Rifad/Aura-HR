name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # A throwaway Postgres for this run. Not Neon — CI should never touch
      # a real database, and a container starts in seconds.
      #
      # pgvector/pgvector, not plain postgres: the migrations create the
      # vector extension, which the stock image does not have.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_NAME: aura_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      # The container has no SSL. Your settings default to require, which
      # is right for Neon and wrong here.
      DB_SSLMODE: disable
      # Deliberately empty. No test calls the model, and CI should fail
      # loudly if one ever starts to.
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
